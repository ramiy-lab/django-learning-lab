{% extends "pages/base.html" %}

{% block content %}

<h2>著者ごとの記事数 (ORM)</h2>

<table>
    <thead>
        <tr>
            <th>著者名</th>
            <th>記事数</th>
        </tr>
    </thead>
    <tbody>
        {% for author_name, article_count in stats %}
        <tr>
            <td>{{ author_name }}</td>
            <td>{{ article_count }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
