{% extends "pages/base.html" %}

{% block content %}

<h1>記事詳細</h1>

<h2>{{ article.title }}</h2>

<p>{{ article.body }}</p>

{% if user == article.user %}

    <p>
        <a href="{% url 'pages:article_update' article.pk %}">
            編集
        </a>
    </p>

{% endif %}

<p>
    <a href="{% url 'pages:article_list' %}">
        ← 一覧へ戻る
    </a>
</p>

{% endblock %}
